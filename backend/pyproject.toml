[project]
name = "wildcut"
version = "0.1.0"
description = "Wild Cut: auto animal edit generator (local-first)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlmodel>=0.0.21",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10",
  "av>=12",
  "scenedetect>=0.6.4",
  "librosa>=0.10",
  "soundfile>=0.12",
  "scipy>=1.13",
  "pillow>=10.3",
  "anthropic>=0.40",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "watchfiles>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["wildcut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
