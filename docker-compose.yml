# Docker alternative to `make dev`: one container runs the API + worker and serves the built UI
# on http://localhost:8787 (ffmpeg bundled). Footage is added by upload or by dropping files
# into ./data/inbox (mounted). Set WILDCUT_ACCESS_TOKEN in .env if the port is reachable from outside.
services:
  app:
    build: .
    env_file: .env
    environment:
      - PORT=8787
      - DATA_DIR=/app/data
      - INBOX_DIR=/app/data/inbox
      - EXPORTS_DIR=/app/data/exports
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
      - ${MEDIA_DIR:-./inbox}:/media:ro
